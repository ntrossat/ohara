services:
  ohara:
    build: .
    ports:
      - "8000:8000"
    environment:
      OHARA_URL: ${OHARA_URL:?Set OHARA_URL to the address people use to open Ohara}
    volumes:
      - ohara-data:/data
    restart: unless-stopped
    # `docker compose up --watch` rebuilds and restarts on code changes.
    develop:
      watch:
        - path: ./frontend
          action: rebuild
          ignore: [node_modules/, dist/]
        - path: ./backend
          action: rebuild
          ignore: [.venv/, .data/, tests/, ohara/static/]

volumes:
  ohara-data:
