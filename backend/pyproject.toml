[project]
name = "ohara"
version = "0.1.0"
description = "Ohara documentation website backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "mcp>=1.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]
