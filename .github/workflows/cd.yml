name: CD

# Publishes the Docker image to the GitHub Container Registry once CI passes on main or on a version tag.
# For a tag push, workflow_run's head_branch is the tag name, so the version comes from it.
# Then, if the repository sets a DEPLOY_COMMAND variable, runs it to deploy main. The command gets the image
# as $IMAGE and the DEPLOY_TOKEN secret as $DEPLOY_TOKEN, so each instance keeps its hosting details out of the code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}

jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: image
        env:
          REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$name:sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == v* ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/metadata-action@v5.10.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ steps.image.outputs.tag }}
            type=semver,pattern={{version}},value=${{ github.event.workflow_run.head_branch }},enable=${{ steps.image.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.workflow_run.head_branch }},enable=${{ steps.image.outputs.release }}
            type=raw,value=latest,enable=${{ steps.image.outputs.release }}
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event.workflow_run.head_branch == 'main' && vars.DEPLOY_COMMAND != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: bash -euo pipefail -c "${DEPLOY_COMMAND//$'\r'/}"  # variables saved from GitHub's web form use CRLF line endings
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
